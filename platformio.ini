; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3]
; Platform gepinnt: pioarduino-Fork (liefert arduino-esp32 3.x).
; Ohne Pinning liefert `pio platform update` potenziell eine neuere
; Version, die API-Bruecken haben kann (ledc-API, Network.h etc.).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
; Hardware-Hinweis fuer das verwendete YD-ESP32-S3 mit CH343P:
; Q2 (Auto-Program-Pulldown an GPIO0) wurde fuer sicheren Akku-Kaltstart
; entfernt. USB-UART-Upload daher manuell einleiten:
; BOOT halten -> RESET kurz -> BOOT loslassen -> Upload starten.
extra_scripts = pre:git_version.py
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_USB_OTG
    -DCONFIG_ESP_WIFI_LOG_ENABLE=0
    -Wall
    -Wextra
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11
lib_deps = 
    h2zero/NimBLE-Arduino
    adafruit/Adafruit NeoPixel
    olikraus/U8g2
; LDF-Modus: deep findet die lokalen USB-Host/VCP-Bibliotheken und die
; transitiven Arduino-ESP32-Abhaengigkeiten in dieser Projektstruktur.
lib_ldf_mode = deep

; Hinweis zu "IRAM: 100.0% (16384/16384)":
; pioarduino 55.03.x liefert vorkompilierte arduino-esp32-Libs. Das Linker-
; script reserviert ~95 KB IRAM fuer das Framework und stellt uns ein
; 16-KB-Fenster fuer eigenen IRAM-Code bereit. Dieses Fenster ist bereits
; durch transitive Libs (NeoPixel Bit-Banging, NimBLE-Host-Timer) voll.
; Unser Code nutzt 0 x IRAM_ATTR, d.h. weiteres Wachstum belegt kein IRAM.
; Die 100% sind hier statisch und harmlos. IRAM wirklich senken geht nur
; durch framework-Rebuild (framework = arduino, espidf + sdkconfig.defaults
; mit CONFIG_FREERTOS_PLACE_FUNCTIONS_INTO_FLASH=y,
; CONFIG_LWIP_IRAM_OPTIMIZATION=n, CONFIG_ESP_WIFI_IRAM_OPT=n).


; OTA Upload Konfiguration
; 1. Mit ConNect WiFi verbinden (SSID: ConNect, PW: 12345678)
; 2. pio run -e esp32-s3-ota -t upload
[env:esp32-s3-ota]
extends = env:esp32-s3
upload_protocol = espota
upload_port = 192.168.32.1
upload_flags = 
    --port=3232
