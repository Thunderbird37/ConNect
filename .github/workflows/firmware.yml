name: Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ESP32-S3 firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check "platformio==6.1.18"

      - name: Test terminal transport
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Isrc \
            test/terminal_transport_test.cpp -o /tmp/connect-terminal-test
          /tmp/connect-terminal-test

      - name: Build firmware
        run: pio run -e esp32-s3

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          build_dir=".pio/build/esp32-s3"
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${version}" >&2
            exit 1
          fi
          mkdir -p dist

          cp "${build_dir}/firmware.bin" dist/firmware.bin
          cp "${build_dir}/firmware.bin" "dist/ConNect-${version}.bin"
          cp "${build_dir}/firmware.elf" "dist/ConNect-${version}.elf"
          cp LICENSE dist/LICENSE
          cp LICENSES/Apache-2.0.txt dist/Apache-2.0.txt
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md

          for asset in bootloader.bin partitions.bin ota_data_initial.bin; do
            if [[ -f "${build_dir}/${asset}" ]]; then
              cp "${build_dir}/${asset}" "dist/${asset}"
            fi
          done

          firmware_md5="$(md5sum dist/firmware.bin | awk '{print $1}')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            firmware_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${version}/firmware.bin"
          else
            firmware_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/firmware.bin"
          fi
          cat > dist/latest.json <<EOF
          {
            "version": "${version}",
            "firmware": "${firmware_url}",
            "md5": "${firmware_md5}"
          }
          EOF

          (
            cd dist
            sha256sum ./*.bin ./*.elf latest.json > SHA256SUMS
          )

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: connect-firmware-${{ github.run_number }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ConNect ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag